[project]
name = "anki-guard"
version = "0.1.0"
description = "Credit a day once Anki's own studied-today figure reaches the day's quota"
requires-python = ">=3.14"
# earned-time: the shared signing (entry_signature/verified) every locker
# ledger uses, so the consumers read this ledger with no Anki-specific code.
# freedays: the shared workday definition (Tue-Thu) the cheaper bars follow.
# The Anki sync server itself is NOT a pip dependency: it is the system
# `anki` package (pacman anki-git) that /usr/bin/anki also runs from.
dependencies = [
    "earned-time @ git+https://github.com/kuhyx/utils@earned-time-v0.5.0#subdirectory=earned_time",
    "freedays @ git+https://github.com/kuhyx/utils@freedays-v0.3.1#subdirectory=freedays",
]

[project.optional-dependencies]
# The test + lint toolchain the pre-commit gate runs from .venv.
dev = ["mypy==2.4.0", "pylint==4.1.2", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.10"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anki_guard*"]

[tool.ruff]
target-version = "py314"
include = ["*.py", "**/*.py"]
exclude = [".git", ".venv", "__pycache__", "build", "dist", ".demo"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "S603"]

# The same test-only relaxations every sibling guard repo uses.
[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "ANN", "ARG", "D", "DTZ001", "DTZ011", "E501", "FBT",
    "PLC0415", "PLR0913", "PLR2004", "PTH", "RUF003", "S101", "S104", "S105",
    "SLF001",
]
# A command line's job is to write to stdout. T201 is auto-fixable under
# --unsafe-fixes and the fixer deletes the very line the timer's journal shows.
"anki_guard/_cli.py" = ["T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["anki_guard"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true
exclude = [".venv/", ".demo/"]

[tool.pylint.main]
py-version = "3.14"
jobs = 0
ignore = [".venv", "__pycache__", ".demo"]
ignore-paths = ["^(.*/)?tests/.*$"]

[tool.pylint.messages_control]
enable = "all"
disable = [
    "use-implicit-booleaness-not-comparison",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
]

[tool.pylint.design]
min-public-methods = 0
max-attributes = 10

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".demo"]

[tool.pytest.ini_options]
testpaths = ["anki_guard/tests"]
# test_phone_scripts imports the adb helpers in scripts/.
pythonpath = ["scripts"]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=anki_guard",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
# An unclosed sqlite connection is a descriptor leak in a pass that runs
# every ten minutes: fail the suite on it.
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
omit = ["anki_guard/tests/*"]
